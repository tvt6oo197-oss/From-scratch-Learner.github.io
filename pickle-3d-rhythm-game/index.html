/* ---------------------------- fx ---------------------------- */
function buildFx() {
  const MAX = 720;
  const pos = new Float32Array(MAX * 3);
  const col = new Float32Array(MAX * 3);
  for (let i = 0; i < MAX; i++) pos[i * 3 + 1] = -999;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const points = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.30, map: GLOW_TEX, vertexColors: true, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  }));
  points.frustumCulled = false;
  scene.add(points);

  const rings = [];
  const ringGeo = new THREE.RingGeometry(0.55, 0.66, 40);
  for (let i = 0; i < 12; i++) {
    const m = new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
      depthWrite: false, side: THREE.DoubleSide,
    });
    const mesh = new THREE.Mesh(ringGeo, m);
    mesh.visible = false;
    scene.add(mesh);
    rings.push({ mesh, mat: m, life: 0, max: 1, grow: 1 });
  }

  SC.fx = {
    MAX, pos, col, geo, points,
    base: new Float32Array(MAX * 3),
    vel: new Float32Array(MAX * 3),
    life: new Float32Array(MAX),
    max: new Float32Array(MAX),
    cursor: 0, rings, ringCursor: 0,
  };
}

function emitBurst(x, y, z, color, count, power) {
  const fx = SC.fx;
  if (!fx) return;
  const c = new THREE.Color(color);
  for (let i = 0; i < count; i++) {
    const idx = fx.cursor;
    fx.cursor = (fx.cursor + 1) % fx.MAX;
    const a = Math.random() * TAU;
    const r = Math.random() * 0.55;
    fx.pos[idx * 3] = x + Math.cos(a) * r;
    fx.pos[idx * 3 + 1] = y + (Math.random() - 0.5) * 0.2;
    fx.pos[idx * 3 + 2] = z + (Math.random() - 0.5) * 0.3;
    const sp = (1.4 + Math.random() * 3.2) * power;
    fx.vel[idx * 3] = Math.cos(a) * sp * (0.7 + Math.random() * 0.6);
    fx.vel[idx * 3 + 1] = (1.6 + Math.random() * 4.2) * power;
    fx.vel[idx * 3 + 2] = Math.sin(a) * sp * 0.6 + 0.8;
    const l = 0.32 + Math.random() * 0.46;
    fx.life[idx] = l;
    fx.max[idx] = l;
    fx.base[idx * 3] = c.r;
    fx.base[idx * 3 + 1] = c.g;
    fx.base[idx * 3 + 2] = c.b;
    fx.col[idx * 3] = c.r;
    fx.col[idx * 3 + 1] = c.g;
    fx.col[idx * 3 + 2] = c.b;
  }
  fx.geo.attributes.position.needsUpdate = true;
  fx.geo.attributes.color.needsUpdate = true;
}

function emitRing(x, y, z, color, size) {
  const fx = SC.fx;
  if (!fx) return;
  const r = fx.rings[fx.ringCursor];
  fx.ringCursor = (fx.ringCursor + 1) % fx.rings.length;
  r.mesh.position.set(x, y, z + 0.1);
  r.mat.color.set(color);
  r.mat.opacity = 0.95;
  r.mesh.scale.setScalar(size * 0.4);
  r.mesh.visible = true;
  r.life = 0.44;
  r.max = 0.44;
  r.grow = size;
}

function updateFx(dt) {
  const fx = SC.fx;
  if (!fx) return;
  let any = false;
  for (let i = 0; i < fx.MAX; i++) {
    if (fx.life[i] <= 0) continue;
    any = true;
    fx.life[i] -= dt;
    if (fx.life[i] <= 0) {
      fx.pos[i * 3 + 1] = -999;
      continue;
    }
    fx.vel[i * 3 + 1] -= 11.5 * dt;
    fx.pos[i * 3] += fx.vel[i * 3] * dt;
    fx.pos[i * 3 + 1] += fx.vel[i * 3 + 1] * dt;
    fx.pos[i * 3 + 2] += fx.vel[i * 3 + 2] * dt;
    const k = fx.life[i] / fx.max[i];
    const f = Math.pow(k, 1.4);
    fx.col[i * 3] = fx.base[i * 3] * f;
    fx.col[i * 3 + 1] = fx.base[i * 3 + 1] * f;
    fx.col[i * 3 + 2] = fx.base[i * 3 + 2] * f;
  }
  if (any) {
    fx.geo.attributes.position.needsUpdate = true;
    fx.geo.attributes.color.needsUpdate = true;
  }

  for (const r of fx.rings) {
    if (r.life <= 0) continue;
    r.life -= dt;
    if (r.life <= 0) { r.mesh.visible = false; continue; }
    const k = 1 - r.life / r.max;
    r.mesh.scale.setScalar(r.grow * (0.35 + k * 1.4));
    r.mat.opacity = 0.95 * (1 - k) * (1 - k);
  }
}

/* ============================ GAME ============================ */
const HIT_W = [0.046, 0.092, 0.145]; /* PERFECT / GREAT / GOOD */
const MISS_W = 0.175;
const FEVER_TIME = 9;

const G = {
  screen: 'title',
  songIndex: 0,
  diff: 1,
  scroll: 1,
  offsetMs: 0,
  notes: [],
  counts: [0, 0, 0, 0],
  judged: 0,
  accSum: 0,
  score: 0,
  shownScore: 0,
  combo: 0,
  maxCombo: 0,
  energy: 0,
  fever: false,
  feverT: 0,
  startTime: 0,
  latency: 0,
  time: 0,
  paused: false,
  pausedCtxTime: 0,
  lastBeat: -1,
  laneFlash: [0, 0, 0, 0],
  camShake: 0,
  shakeSeed: 0,
  auto: false,
  ended: false,
  presses: 0,
};

const MUSIC = {
  timer: null, nextStep: 0, totalSteps: 0, stepDur: 0, at: 0, running: false, song: null,

  start(song, at) {
    this.stop();
    const ctx = AUDIO.ctx;
    if (!ctx) return;
    this.song = song;
    this.stepDur = 60 / song.bpm / 4;
    this.totalSteps = song.bars * 16;
    this.nextStep = 0;
    this.at = at;
    this.running = true;
    this.tick();
    this.timer = setInterval(() => this.tick(), 25);
  },

  tick() {
    if (!this.running || !AUDIO.ctx) return;
    const ctx = AUDIO.ctx;
    const horizon = ctx.currentTime + 0.22;
    let guard = 0;
    while (this.nextStep < this.totalSteps && guard++ < 400) {
      const t = this.at + this.nextStep * this.stepDur;
      if (t > horizon) break;
      if (t > ctx.currentTime - 0.06) this.play(this.nextStep, t);
      this.nextStep++;
    }
  },

  play(index, t) {
    const bar = Math.floor(index / 16);
    const step = index % 16;
    const s = stepData(this.song, bar, step);
    if (s.kick) AUDIO.kick(t, s.kick);
    if (s.snare) AUDIO.snare(t, s.snare);
    if (s.hat) AUDIO.hat(t, s.hat, false);
    if (s.open) AUDIO.hat(t, s.open, true);
    if (s.bass) AUDIO.bass(t, s.bass.midi, s.bass.len, s.bass.vel);
    if (s.lead) AUDIO.lead(t, s.lead.midi, s.lead.len, s.lead.vel);
    if (s.arp) AUDIO.arp(t, s.arp, this.stepDur * 1.7, s.sec === 'break' ? 0.95 : 0.6);
    if (s.pad) AUDIO.pad(t, s.pad, this.stepDur * 16 * 0.96, 1);
    if (s.fx === 'crash') AUDIO.crash(t, 0.85);
    if (s.fx === 'riser') AUDIO.riser(t, this.stepDur * 64);
  },

  stop() {
    this.running = false;
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  },
};

/* ---------------------------- boot ---------------------------- */
function boot() {
  initGraphics();
  buildSongList();
  bindUI();
  loadPrefs();
  window.__pickleBooted = true;
  const b = $('#boot');
  b.classList.add('gone');
  setTimeout(() => b.remove(), 700);
  requestAnimationFrame(frame);
}

/* ---------------------------- UI: title ---------------------------- */
function buildSongList() {
  const wrap = $('#songList');
  wrap.innerHTML = '';
  SONGS.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'song' + (i === G.songIndex ? ' sel' : '');
    btn.dataset.index = i;
    btn.style.setProperty('--sc1', s.c1);
    btn.style.setProperty('--sc2', s.c2);
    btn.style.setProperty('--sc-glow', s.glow);
    btn.innerHTML =
      '<span class="chip"></span>' +
      '<span class="meta"><b>' + s.ko + '</b><span>' + s.tag + '</span></span>' +
      '<span class="bpm"><i>BPM</i>' + s.bpm + '</span>';
    btn.addEventListener('click', () => {
      if (AUDIO.ctx) AUDIO.uiClick();
      selectSong(i);
    });
    wrap.appendChild(btn);
  });
}

function selectSong(i) {
  G.songIndex = (i + SONGS.length) % SONGS.length;
  $$('.song').forEach((el, k) => el.classList.toggle('sel', k === G.songIndex));
  savePrefs();
}

function selectDiff(d) {
  G.diff = clamp(d, 0, 2);
  $$('#diffSeg button').forEach((b) => b.classList.toggle('on', +b.dataset.diff === G.diff));
  savePrefs();
}

function selectSpeed(v) {
  G.scroll = v;
  $$('#speedSeg button').forEach((b) => b.classList.toggle('on', Math.abs(+b.dataset.speed - v) < 0.01));
  savePrefs();
}

/* ---------------------------- prefs ---------------------------- */
function savePrefs() {
  try {
    localStorage.setItem('pickle-rhythm-v1', JSON.stringify({
      song: G.songIndex, diff: G.diff, scroll: G.scroll, vol: AUDIO.vol, sfx: AUDIO.sfxOn, off: G.offsetMs,
    }));
  } catch (e) { /* file:// 등 */ }
}
function loadPrefs() {
  let p = null;
  try { p = JSON.parse(localStorage.getItem('pickle-rhythm-v1') || 'null'); } catch (e) { p = null; }
  if (!p) return;
  if (typeof p.song === 'number') selectSong(p.song);
  if (typeof p.diff === 'number') selectDiff(p.diff);
  if (typeof p.scroll === 'number') selectSpeed(p.scroll);
  if (typeof p.vol === 'number') {
    AUDIO.vol = clamp(p.vol, 0, 1);
    $('#volRange').value = Math.round(AUDIO.vol * 100);
    $('#volVal').textContent = Math.round(AUDIO.vol * 100);
  }
  if (typeof p.sfx === 'boolean') {
    AUDIO.sfxOn = p.sfx;
    $('#sfxToggle').classList.toggle('on', p.sfx);
    $('#sfxToggle').setAttribute('aria-checked', String(p.sfx));
  }
  if (typeof p.off === 'number') {
    G.offsetMs = clamp(p.off, -120, 120);
    $('#offsetRange').value = G.offsetMs;
    $('#offsetVal').textContent = G.offsetMs + 'ms';
  }
}

/* ---------------------------- flow ---------------------------- */
async function startGame() {
  const song = SONGS[G.songIndex];
  MUSIC.stop();
  if (AUDIO.ctx) { try { AUDIO.stopAll(); } catch (e) {} }

  AUDIO.init();
  const ctx = AUDIO.ctx;
  if (ctx) {
    try { await ctx.resume(); } catch (e) {}
    if (ctx.state === 'suspended') { try { await ctx.resume(); } catch (e) {} }
    AUDIO.setVolume(AUDIO.vol);
    AUDIO.musicBus.gain.cancelScheduledValues(ctx.currentTime);
    AUDIO.musicBus.gain.setValueAtTime(0.92, ctx.currentTime);
  }

  G.notes = buildChart(song, G.diff).map((n) => ({ ...n, hit: false, judged: false, missed: false }));
  G.counts = [0, 0, 0, 0];
  G.judged = 0;
  G.accSum = 0;
  G.score = 0;
  G.shownScore = 0;
  G.combo = 0;
  G.maxCombo = 0;
  G.energy = 0;
  G.fever = false;
  G.feverT = 0;
  G.paused = false;
  G.ended = false;
  G.lastBeat = -1;
  G.laneFlash = [0, 0, 0, 0];
  G.time = 0;

  let lat = 0;
  if (ctx) {
    if (typeof ctx.outputLatency === 'number' && ctx.outputLatency > 0) lat = ctx.outputLatency;
    else if (typeof ctx.baseLatency === 'number' && ctx.baseLatency > 0) lat = ctx.baseLatency;
  }
  G.latency = clamp(lat, 0, 0.35) + G.offsetMs / 1000;

  AUDIO.cancelSilence();
  hudCache.score = -1; hudCache.combo = -1; hudCache.acc = -1;
  hudCache.prog = -1; hudCache.fever = -1; hudCache.feverOn = null;

  const pre = 0.9;
  G.startTime = (ctx ? ctx.currentTime : 0) + pre;
  if (ctx) MUSIC.start(song, G.startTime);

  $('#hudTitle').textContent = song.ko;
  $('#hudDiff').textContent = ['EASY', 'NORMAL', 'HARD'][G.diff];
  $('#scoreVal').textContent = '0';
  $('#comboVal').textContent = '0';
  $('#comboBox').classList.remove('on');
  $('#accVal').textContent = '100.00%';
  $('#progressNum').textContent = '0%';
  $('#progressFill').style.width = '0%';
  $('#feverFill').style.width = '0%';
  $('#feverPct').textContent = '0%';
  $('#judgeLayer').innerHTML = '';

  $('#titleScreen').classList.add('hidden');
  $('#pauseScreen').classList.add('hidden');
  $('#resultScreen').classList.add('hidden');
  $('#app').dataset.screen = 'play';
  $('#app').dataset.fever = '0';
  G.screen = 'play';
}

function pauseGame() {
  if (G.screen !== 'play' || G.paused) return;
  G.paused = true;
  G.pausedCtxTime = AUDIO.ctx ? AUDIO.ctx.currentTime : 0;
  MUSIC.stop();
  if (AUDIO.ctx) { try { AUDIO.ctx.suspend(); } catch (e) {} }
  G.screen = 'pause';
  $('#app').dataset.screen = 'pause';
  $('#pauseInfo').textContent = SONGS[G.songIndex].ko + ' · ' + ['EASY', 'NORMAL', 'HARD'][G.diff];
  $('#pauseScreen').classList.remove('hidden');
}

async function resumeGame() {
  if (G.screen !== 'pause') return;
  const ctx = AUDIO.ctx;
  if (ctx) {
    try { await ctx.resume(); } catch (e) {}
    const drift = ctx.currentTime - G.pausedCtxTime;
    G.startTime += Math.max(0, drift);
    MUSIC.at = G.startTime;
    MUSIC.nextStep = Math.max(MUSIC.nextStep, Math.floor((ctx.currentTime - G.startTime) / MUSIC.stepDur) + 1);
    MUSIC.running = true;
    MUSIC.timer = setInterval(() => MUSIC.tick(), 25);
  }
  G.paused = false;
  G.screen = 'play';
  $('#app').dataset.screen = 'play';
  $('#pauseScreen').classList.add('hidden');
}

function quitToMenu() {
  MUSIC.stop();
  if (AUDIO.ctx) {
    try { AUDIO.ctx.resume(); } catch (e) {}
    AUDIO.stopAll();
  }
  G.paused = false;
  G.screen = 'title';
  G.ended = false;
  $('#app').dataset.screen = 'title';
  $('#app').dataset.fever = '0';
  $('#pauseScreen').classList.add('hidden');
  $('#resultScreen').classList.add('hidden');
  $('#titleScreen').classList.remove('hidden');
}

function finishSong() {
  if (G.screen === 'result' || G.ended) return;
  G.ended = true;
  MUSIC.stop();
  if (AUDIO.ctx) AUDIO.silenceMusic();
  G.screen = 'result';
  $('#app').dataset.screen = 'result';
  $('#app').dataset.fever = '0';

  const song = SONGS[G.songIndex];
  const total = G.judged || 0;
  const acc = total ? (G.accSum / total) * 100 : 0;
  const rank = acc >= 97 ? 'S' : acc >= 92 ? 'A' : acc >= 85 ? 'B' : 'C';
  $('#rankLetter').textContent = rank;
  $('#rankRing').style.setProperty('--p', clamp(acc, 2, 100).toFixed(1) + '%');
  $('#resultSong').textContent = song.ko + ' · ' + ['EASY', 'NORMAL', 'HARD'][G.diff];
  $('#resultScore').textContent = Math.round(G.score).toLocaleString('en-US');
  $('#rAcc').textContent = acc.toFixed(2) + '%';
  $('#rCombo').textContent = G.maxCombo;
  $('#rNotes').textContent = G.notes.length;
  $('#cPerfect').textContent = G.counts[0];
  $('#cGreat').textContent = G.counts[1];
  $('#cGood').textContent = G.counts[2];
  $('#cMiss').textContent = G.counts[3];
  const fc = G.counts[3] === 0 && G.notes.length > 0;
  $('#resultHead').style.display = fc ? '' : 'none';

  setTimeout(() => {
    if (G.screen === 'result') $('#resultScreen').classList.remove('hidden');
  }, 520);
}

/* ---------------------------- judging ---------------------------- */
function popJudge(kind) {
  popText(['PERFECT', 'GREAT', 'GOOD', 'MISS'][kind], ['perfect', 'great', 'good', 'miss'][kind]);
}

function popText(text, cls) {
  const layer = $('#judgeLayer');
  if (layer.childElementCount >= 3) layer.removeChild(layer.firstChild);
  const el = document.createElement('div');
  el.className = 'judge ' + cls;
  el.textContent = text;
  el.style.marginTop = (-30 * layer.childElementCount) + 'px';
  layer.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 680);
}

function pressLane(lane) {
  if (G.screen !== 'play' || G.paused) return;
  const t = gameTimeNow();
  if (t < -0.6) return;
  let best = null, bestD = 9;
  for (let i = 0; i < G.notes.length; i++) {
    const n = G.notes[i];
    if (n.judged || n.lane !== lane) continue;
    const dt = n.t - t;
    if (dt > 0.42) break;
    const d = Math.abs(dt);
    if (d < bestD) { bestD = d; best = n; }
  }
  laneTapVisual(lane);
  G.presses++;
  if (!best || bestD > MISS_W) return;
  judgeNote(best, bestD);
}

function judgeNote(n, d) {
  n.judged = true;
  n.hit = true;
  const k = d <= HIT_W[0] ? 0 : d <= HIT_W[1] ? 1 : 2;
  G.counts[k]++;
  G.judged++;
  G.accSum += [1, 0.72, 0.4][k];
  G.combo++;
  if (G.combo > G.maxCombo) G.maxCombo = G.combo;

  const mult = 1 + Math.min(1.2, Math.floor(G.combo / 15) * 0.1);
  G.score += [1000, 690, 380][k] * mult * (G.fever ? 2 : 1);

  if (!G.fever) {
    G.energy = clamp(G.energy + [1.15, 0.7, 0.32][k], 0, 100);
    if (G.energy >= 100) {
      G.energy = 100;
      triggerFever();
    }
  }

  popJudge(k);
  AUDIO.hitSfx(n.lane, k);

  const x = LANE_X[n.lane];
  emitBurst(x, NOTE_Y + 0.05, 0.1, LANE_HEX[n.lane], k === 0 ? 16 : k === 1 ? 11 : 7, k === 0 ? 1.15 : 0.85);
  if (k === 0) emitRing(x, NOTE_Y, 0.05, LANE_HEX[n.lane], 1.25);
  if (k === 0 && G.combo > 0 && G.combo % 25 === 0) {
    emitRing(0, MASCOT_Y - 1.5, MASCOT_Z, 0xc9a6ff, 5.5);
    emitBurst(0, MASCOT_Y - 0.6, MASCOT_Z, 0xd8bcff, 26, 1.4);
    SC.mascot.comboGlow = 1;
  }

  G.camShake = Math.min(0.22, G.camShake + (k === 0 ? 0.09 : 0.05));
  laneHitVisual(n.lane, k);
  if (SC.mascot) SC.mascot.hitPulse = Math.min(1, SC.mascot.hitPulse + (k === 0 ? 0.85 : 0.5));
}

function missNote(n) {
  n.judged = true;
  n.missed = true;
  G.counts[3]++;
  G.judged++;
  G.combo = 0;
  G.energy = clamp(G.energy - 4.5, 0, 100);
  if (G.fever) G.feverT = Math.max(0, G.feverT - 0.35);
  popJudge(3);
  if (SC.mascot) SC.mascot.missT = 1;
  SC.rings[n.lane].pulse = Math.max(SC.rings[n.lane].pulse, 0.55);
}

function triggerFever() {
  G.fever = true;
  G.feverT = FEVER_TIME;
  $('#app').dataset.fever = '1';
  SC.mascot.comboGlow = 1;
  emitRing(0, MASCOT_Y - 1.4, MASCOT_Z, 0xffd479, 7);
  for (let i = 0; i < 4; i++) emitBurst(LANE_X[i], NOTE_Y, 0, LANE_HEX[i], 12, 1.2);
  popText('FEVER!', 'perfect');
}

function laneTapVisual(lane) {
  const pads = $$('.pad');
  const el = pads[lane];
  if (!el) return;
  /* 터치/키 모두 잠깐 밝게 */
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => { if (!el._held) el.classList.remove('on'); }, 110);
}

function laneHitVisual(lane) {
  SC.rings[lane].pulse = 1;
  G.laneFlash[lane] = 1;
}

/* ---------------------------- time ---------------------------- */
function gameTimeNow() {
  if (!AUDIO.ctx) return 0;
  return AUDIO.ctx.currentTime - G.startTime - G.latency;
}

/* ---------------------------- loop ---------------------------- */
let lastFrameT = 0;
let dashT = 0;

function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0.0005, (ts - lastFrameT) / 1000)) || 0.016;
  lastFrameT = ts;
  const wall = ts / 1000;
  fpsAcc += dt; fpsN++;
  update(dt, wall);
  composer.render();
}

function update(dt, wall) {
  const song = SONGS[G.songIndex];

  if (G.screen === 'play' && !G.paused) {
    G.time = gameTimeNow();
    if (G.time < -0.35) G.time = -0.35;

    /* 자동 판정 (테스트/관전) */
    if (G.auto) {
      for (const n of G.notes) {
        if (n.judged) continue;
        if (n.t - G.time > 0.025) break;
        judgeNote(n, Math.min(MISS_W, Math.abs(n.t - G.time)));
      }
    }

    /* 미스 판정 */
    for (const n of G.notes) {
      if (n.judged) continue;
      if (n.t < G.time - MISS_W) missNote(n);
      else if (n.t > G.time + 2) break;
    }

    /* 피버 */
    if (G.fever) {
      G.feverT -= dt;
      G.energy = clamp((G.feverT / FEVER_TIME) * 100, 0, 100);
      if (G.feverT <= 0) {
        G.fever = false;
        G.energy = 0;
        $('#app').dataset.fever = '0';
      }
    }

    /* 종료 */
    if (G.time > songDuration(song) + 0.45) finishSong();

    updateHUD(dt);
  }

  const spb = 60 / song.bpm;
  const beatT = (G.screen === 'play' || G.screen === 'pause') ? G.time : wall;
  const beat = beatT / spb;
  const bp = beat - Math.floor(beat);
  const pulse = Math.exp(-bp * 5.0);

  updateStage(dt, wall, pulse, bp);
  updateNotesVisual(G.screen === 'play' || G.screen === 'pause' ? G.time : -99);
  updateFx(dt);
}

/* ---------------------------- HUD ---------------------------- */
const hudCache = { score: -1, combo: -1, acc: -1, prog: -1, fever: -1, feverOn: null };
function updateHUD(dt) {
  G.shownScore = damp(G.shownScore, G.score, 12, dt);
  const s = Math.round(G.shownScore);
  if (s !== hudCache.score) {
    $('#scoreVal').textContent = s.toLocaleString('en-US');
    hudCache.score = s;
  }
  if (G.combo !== hudCache.combo) {
    $('#comboVal').textContent = G.combo;
    $('#comboBox').classList.toggle('on', G.combo >= 3);
    const box = $('#comboBox');
    box.classList.remove('pop');
    void box.offsetWidth;
    box.classList.add('pop');
    hudCache.combo = G.combo;
  }
  const acc = G.judged ? (G.accSum / G.judged) * 100 : 100;
  const accR = Math.round(acc * 100) / 100;
  if (accR !== hudCache.acc) {
    $('#accVal').textContent = accR.toFixed(2) + '%';
    hudCache.acc = accR;
  }
  const dur = songDuration(SONGS[G.songIndex]);
  const prog = clamp(G.time / dur, 0, 1);
  const progR = Math.round(prog * 1000) / 10;
  if (progR !== hudCache.prog) {
    $('#progressFill').style.width = (prog * 100).toFixed(1) + '%';
    $('#progressNum').textContent = Math.round(prog * 100) + '%';
    hudCache.prog = progR;
  }
  const fv = Math.round(G.energy);
  if (fv !== hudCache.fever) {
    $('#feverFill').style.width = fv + '%';
    $('#feverPct').textContent = fv + '%';
    hudCache.fever = fv;
  }
  if (G.fever !== hudCache.feverOn) {
    hudCache.feverOn = G.fever;
    $('#feverWord').textContent = G.fever ? 'FEVER TIME' : 'FEVER';
  }
}

/* ---------------------------- visuals ---------------------------- */
function updateNotesVisual(t) {
  const counts = [0, 0, 0, 0];
  const approach = 1.72 / G.scroll;
  const speed = -SPAWN_Z / approach;
  for (let i = 0; i < G.notes.length; i++) {
    const n = G.notes[i];
    if (n.judged) continue;
    const dz = n.t - t;
    if (dz > approach + 0.35) break;
    if (dz < -0.25) continue;
    const lane = n.lane;
    const pool = SC.notePools[lane];
    if (counts[lane] >= NOTE_CAP) continue;
    const z = -dz * speed;
    const fadeIn = clamp((approach + 0.35 - dz) * 6, 0, 1);
    const near = clamp(1 - Math.max(0, dz) / approach, 0, 1);
    pool.dummy.position.set(LANE_X[lane], NOTE_Y, z);
    const sc = 0.72 + 0.28 * fadeIn;
    pool.dummy.scale.set(sc, sc * (1 + near * 0.06), sc);
    pool.dummy.rotation.set(0, 0, 0);
    pool.dummy.updateMatrix();
    pool.inst.setMatrixAt(counts[lane], pool.dummy.matrix);
    pool.dummy.position.set(LANE_X[lane], NOTE_Y, z + 0.25);
    pool.dummy.scale.set(sc * (1 + near * 0.3), sc * (1 + near * 0.2), 1);
    pool.dummy.updateMatrix();
    pool.halo.setMatrixAt(counts[lane], pool.dummy.matrix);
    counts[lane]++;
  }
  for (let l = 0; l < 4; l++) {
    const pool = SC.notePools[l];
    pool.inst.count = counts[l];
    pool.inst.instanceMatrix.needsUpdate = true;
    pool.halo.count = counts[l];
    pool.halo.instanceMatrix.needsUpdate = true;
  }
}

function updateStage(dt, wall, pulse, bp) {
  const feverPulse = G.fever ? 1 : 0;
  if (SC.floorMat) {
    SC.floorMat.uniforms.uTime.value = wall;
    SC.floorMat.uniforms.uBeat.value = pulse * 0.85 + (G.fever ? 0.4 : 0);
    SC.floorMat.uniforms.uEnergy.value = damp(SC.floorMat.uniforms.uEnergy.value, G.fever ? 1 : G.energy / 100, 3, dt);
  }
  if (SC.skyMat) SC.skyMat.uniforms.uPulse.value = damp(SC.skyMat.uniforms.uPulse.value, pulse * 0.5 + feverPulse * 0.5, 8, dt);

  /* 아치 */
  for (let i = 0; i < SC.archMats.length; i++) {
    const m = SC.archMats[i];
    const k = i / SC.archMats.length;
    m.opacity = (0.07 + 0.10 * pulse) * (1 - k * 0.5) * (G.fever ? 1.4 : 1);
  }
  if (SC.pillars) {
    for (let i = 0; i < SC.pillars.length; i++) {
      const p = SC.pillars[i];
      p.mat.opacity = 0.14 + pulse * 0.34 + (G.fever ? 0.22 : 0) + Math.sin(wall * 2 + p.seed) * 0.03;
    }
  }
  if (SC.moon) SC.moon.mat.opacity = 0.34 + pulse * 0.10 + (G.fever ? 0.2 : 0);

  /* 레인 라이트 */
  for (let i = 0; i < SC.laneLights.length; i++) {
    const L = SC.laneLights[i];
    const fl = G.laneFlash[i];
    L.light.intensity = 4.0 + pulse * 5.5 + fl * 14 + (G.fever ? 4 : 0);
    G.laneFlash[i] = damp(fl, 0, 9, dt);
  }

  /* 히트 패널 */
  for (let i = 0; i < SC.rings.length; i++) {
    const r = SC.rings[i];
    r.pulse = damp(r.pulse, 0, 7, dt);
    const g = SC.ringGlow[i];
    const gs = 2.15 + r.pulse * 1.2 + pulse * 0.18;
    g.sp.scale.set(gs, gs * 0.52, 1);
    g.mat.opacity = 0.035 + r.pulse * 0.3 + pulse * 0.02;
    if (SC.slots && SC.slots[i]) {
      SC.slots[i].mat.opacity = 0.55 + r.pulse * 0.45 + pulse * 0.18;
      SC.slots[i].mesh.scale.set(1 + r.pulse * 0.08, 1 + r.pulse * 1.6, 1 + r.pulse * 0.8);
    }
    if (SC.panels && SC.panels[i]) {
      SC.panels[i].mat.opacity = 0.035 + r.pulse * 0.14 + pulse * 0.02;
    }
  }
  if (SC.zone) SC.zone.mat.opacity = 0.07 + pulse * 0.06 + (G.fever ? 0.05 : 0);

  /* 카메라 */
  const shake = G.camShake;
  G.camShake = damp(shake, 0, 8, dt);
  const sx = (Math.sin(wall * 61.7) + Math.sin(wall * 37.3)) * 0.5 * shake;
  const sy = (Math.sin(wall * 53.1) + Math.sin(wall * 29.7)) * 0.5 * shake;
  const title = G.screen === 'title';
  const C = (window.innerWidth / window.innerHeight) < 0.95 ? CAM.port : CAM.land;
  const drift = title ? Math.sin(wall * 0.34) * 0.5 : 0;
  const driftY = title ? Math.sin(wall * 0.27) * 0.18 : 0;
  camera.position.x = damp(camera.position.x, C.p[0] + sx + drift, 4, dt);
  camera.position.y = damp(camera.position.y, C.p[1] + sy + driftY, 4, dt);
  camera.position.z = damp(camera.position.z, C.p[2] - (G.fever ? 0.45 : 0), 3, dt);
  camera.lookAt(drift * 0.3, C.t[1] + (title ? Math.sin(wall * 0.4) * 0.18 : 0), C.t[2]);

  /* 마스코트 */
  updateMascot(dt, wall, pulse, bp);

  if (SC.stars) SC.stars.rotation.y = wall * 0.008;

  /* 블룸 */
  const targetBloom = (G.fever ? 1.0 : 0.42) + pulse * 0.05;
  bloomPass.strength = damp(bloomPass.strength, targetBloom, 4, dt);
}

function updateMascot(dt, wall, pulse, bp) {
  const M = SC.mascot;
  if (!M) return;
  M.hitPulse = damp(M.hitPulse, 0, 6, dt);
  M.missT = damp(M.missT, 0, 3.2, dt);
  M.comboGlow = damp(M.comboGlow, 0, 1.6, dt);

  const idle = Math.sin(wall * 1.6) * 0.06;
  const bounce = pulse * 0.30;
  const feverLift = G.fever ? 0.45 + Math.sin(wall * 6) * 0.06 : 0;
  M.group.position.y = M.baseY + idle + bounce + feverLift;

  const sq = 1 + pulse * 0.05 + M.hitPulse * 0.11 - M.missT * 0.07;
  const sxz = 1 - pulse * 0.035 - M.hitPulse * 0.05 + M.missT * 0.05;
  M.group.scale.set(M.baseScale * sxz, M.baseScale * sq, M.baseScale * sxz);

  /* 콤보/피버 스핀 */
  const spinSpeed = G.fever ? 1.6 : M.comboGlow * 1.2;
  M.spin += dt * spinSpeed;
  M.group.rotation.z = Math.sin(M.spin) * (G.fever ? 0.10 : 0.05) - M.missT * 0.18 * Math.sin(wall * 26);
  M.group.rotation.y = G.fever ? Math.sin(M.spin * 0.9) * 0.22 : Math.sin(wall * 0.7) * 0.06;

  /* 얼굴 표정 */
  M.eyes.forEach((e, i) => {
    const px = Math.sin(wall * 0.9 + i) * 0.025;
    e.pupil.position.x = (i === 0 ? -1 : 1) * 0.25 + px;
    e.pupil.position.y = 0.065 + Math.sin(wall * 1.3 + i * 0.7) * 0.012 - M.missT * 0.03;
    const blink = M.blink > 0;
    e.eye.scale.y = blink ? 0.12 : 1.08;
    e.pupil.scale.y = blink ? 0.12 : 1.05;
    e.spark.visible = !blink;
  });
  M.blinkT -= dt;
  if (M.blinkT <= 0) { M.blink = 1; M.blinkT = 2.6 + Math.random() * 2.6; }
  M.blink = Math.max(0, M.blink - dt * 9);

  /* 감정 색 */
  const feverMix = G.fever ? 1 : 0;
  const missMix = M.missT;
  const base = new THREE.Color(0xd7bcff);
  const gold = new THREE.Color(0xffd9a0);
  const blue = new THREE.Color(0xa8b6ff);
  const c = base.clone().lerp(gold, feverMix * 0.85).lerp(blue, missMix * 0.5);
  M.bodyMat.color.lerp(c, 1 - Math.exp(-6 * dt));
  M.bodyMat.emissiveIntensity = 0.32 + M.hitPulse * 0.5 + (G.fever ? 0.22 : 0) + pulse * 0.1;
  M.bodyMat.emissive.setHex(G.fever ? 0xc07a20 : 0x6d3fc0);

  M.halo.rotation.z += dt * (0.6 + M.comboGlow * 2.2 + (G.fever ? 3 : 0));
  const hs = 1 + M.comboGlow * 0.18 + (G.fever ? 0.2 : 0);
  M.halo.scale.set(hs, hs, 1);
  M.haloMat.opacity = 0.18 + pulse * 0.12 + M.comboGlow * 0.35 + (G.fever ? 0.25 : 0);
  M.haloMat.color.setHex(G.fever ? 0xffc46b : 0xb98cff);

  M.auraMat.opacity = 0.22 + pulse * 0.12 + M.hitPulse * 0.2 + (G.fever ? 0.18 : 0);
  M.auraMat.color.setHex(G.fever ? 0xffb45e : 0xa678ff);
  const as = 5.8 + pulse * 0.4 + M.hitPulse * 0.7 + (G.fever ? 1.4 : 0);
  M.aura.scale.set(as, as, 1);
}

/* ---------------------------- input ---------------------------- */
const KEY_LANE = { d: 0, f: 1, j: 2, k: 3, arrowleft: 0, arrowdown: 1, arrowup: 2, arrowright: 3 };

function bindUI() {
  /* 곡/난이도/옵션 */
  $$('#diffSeg button').forEach((b) => b.addEventListener('click', () => {
    if (AUDIO.ctx) AUDIO.uiClick();
    selectDiff(+b.dataset.diff);
  }));
  $$('#speedSeg button').forEach((b) => b.addEventListener('click', () => {
    if (AUDIO.ctx) AUDIO.uiClick();
    selectSpeed(+b.dataset.speed);
  }));
  $('#volRange').addEventListener('input', (e) => {
    AUDIO.vol = +e.target.value / 100;
    $('#volVal').textContent = e.target.value;
    AUDIO.setVolume(AUDIO.vol);
    savePrefs();
  });
  $('#offsetRange').addEventListener('input', (e) => {
    G.offsetMs = +e.target.value;
    $('#offsetVal').textContent = G.offsetMs + 'ms';
    savePrefs();
  });
  $('#sfxToggle').addEventListener('click', (e) => {
    AUDIO.sfxOn = !AUDIO.sfxOn;
    e.currentTarget.classList.toggle('on', AUDIO.sfxOn);
    e.currentTarget.setAttribute('aria-checked', String(AUDIO.sfxOn));
    if (AUDIO.sfxOn) AUDIO.uiClick();
    savePrefs();
  });

  $('#startBtn').addEventListener('click', () => { startGame(); });
  $('#pauseBtn').addEventListener('click', () => pauseGame());
  $('#restartHud').addEventListener('click', () => { resumeCtxThen(startGame); });
  $('#resumeBtn').addEventListener('click', () => resumeGame());
  $('#restartBtn').addEventListener('click', () => { resumeCtxThen(startGame); });
  $('#quitBtn').addEventListener('click', () => quitToMenu());
  $('#againBtn').addEventListener('click', () => { startGame(); });
  $('#menuBtn').addEventListener('click', () => quitToMenu());

  /* 터치 패드 */
  $$('.pad').forEach((pad) => {
    const lane = +pad.dataset.lane;
    const ids = new Set();
    pad.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      try { pad.setPointerCapture(e.pointerId); } catch (err) {}
      ids.add(e.pointerId);
      pad._held = true;
      pad.classList.add('on');
      pressLane(lane);
    }, { passive: false });
    const release = (e) => {
      ids.delete(e.pointerId);
      if (!ids.size) { pad._held = false; pad.classList.remove('on'); }
    };
    pad.addEventListener('pointerup', release);
    pad.addEventListener('pointercancel', release);
    pad.addEventListener('lostpointercapture', release);
    pad.addEventListener('contextmenu', (e) => e.preventDefault());
  });

  /* 키보드 */
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (e.repeat) {
      if (KEY_LANE[k] !== undefined && G.screen === 'play') e.preventDefault();
      return;
    }
    if (G.screen === 'play') {
      if (k === ' ') { e.preventDefault(); pauseGame(); return; }
      if (k === 'escape') { e.preventDefault(); pauseGame(); return; }
      if (KEY_LANE[k] !== undefined) {
        e.preventDefault();
        pressLane(KEY_LANE[k]);
        return;
      }
    } else if (G.screen === 'pause') {
      if (k === ' ' || k === 'escape') { e.preventDefault(); resumeGame(); return; }
      if (k === 'r') { e.preventDefault(); resumeCtxThen(startGame); return; }
    } else if (G.screen === 'title') {
      if (k === 'arrowup' || k === 'w') { e.preventDefault(); selectSong(G.songIndex - 1); return; }
      if (k === 'arrowdown' || k === 's') { e.preventDefault(); selectSong(G.songIndex + 1); return; }
      if (k === 'arrowleft' || k === 'a') { e.preventDefault(); selectDiff(G.diff - 1); return; }
      if (k === 'arrowright') { e.preventDefault(); selectDiff(G.diff + 1); return; }
      if (k === '1' || k === '2' || k === '3') { e.preventDefault(); selectDiff(+k - 1); return; }
      if (k === 'enter' || k === ' ') { e.preventDefault(); startGame(); return; }
    } else if (G.screen === 'result') {
      if (k === 'enter' || k === ' ') { e.preventDefault(); startGame(); return; }
      if (k === 'escape') { e.preventDefault(); quitToMenu(); return; }
    }
  }, { passive: false });

  window.addEventListener('keyup', (e) => {
    if (G.screen !== 'play') return;
    const lane = KEY_LANE[e.key.toLowerCase()];
    if (lane !== undefined) {
      const pad = $$('.pad')[lane];
      if (pad && !pad._held) pad.classList.remove('on');
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && G.screen === 'play') pauseGame();
  });

  window.addEventListener('contextmenu', (e) => {
    if (G.screen === 'play') e.preventDefault();
  });
}

async function resumeCtxThen(fn) {
  if (AUDIO.ctx) { try { await AUDIO.ctx.resume(); } catch (e) {} }
  fn();
}

/* ---------------------------- debug API ---------------------------- */
window.PICKLE = {
  G, SC, AUDIO, MUSIC, SONGS,
  start: (i, d) => { if (typeof i === 'number') G.songIndex = i; if (typeof d === 'number') G.diff = d; return startGame(); },
  press: pressLane,
  pause: pauseGame,
  resume: resumeGame,
  menu: quitToMenu,
  setAuto: (v) => { G.auto = !!v; },
  chart: () => buildChart(SONGS[G.songIndex], G.diff).length,
  snapshot: () => ({
    screen: G.screen,
    time: +G.time.toFixed(3),
    score: Math.round(G.score),
    combo: G.combo,
    maxCombo: G.maxCombo,
    judged: G.judged,
    total: G.notes.length,
    counts: G.counts.slice(),
    acc: G.judged ? +((G.accSum / G.judged) * 100).toFixed(2) : 100,
    fever: G.fever,
    presses: G.presses,
    energy: Math.round(G.energy),
    activeNotes: G.notes.filter((n) => !n.judged).length,
    visibleNotes: SC.notePools.reduce((a, p) => a + p.inst.count, 0),
    audioState: AUDIO.ctx ? AUDIO.ctx.state : 'none',
    audioTime: AUDIO.ctx ? +AUDIO.ctx.currentTime.toFixed(3) : 0,
    fps: lastFps,
  }),
};
let lastFps = 0;
let fpsAcc = 0, fpsN = 0;
setInterval(() => {
  if (fpsAcc > 0.05) lastFps = Math.round(fpsN / fpsAcc);
  fpsAcc = 0; fpsN = 0;
}, 500);

/* boot on next frame */
requestAnimationFrame(() => {
  try {
    boot();
  } catch (err) {
    const b = $('#boot');
    if (b) {
      b.classList.add('err');
      b.querySelector('span').textContent = '게임을 시작하지 못했어요: ' + err.message;
    }
    console.error(err);
  }
});

</script>
